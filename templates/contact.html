{% extends "base.html" %}
{% block title %}Contact – Pick & Brand Print Shop{% endblock %}
{% block content %}
<section class="first two">
  <div>
    <h2>Talk to a printer</h2>
    <p>Tell us what you're making and when you need it. A person replies within one working day.</p>
    <p class="note">hello@pickandbrand.example</p>
  </div>
  <form class="card" method="post">
    <label for="name">Your name</label>
    <input id="name" name="name" value="{{ form.get('name','') }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.get('email','') }}" required>
    <label for="message">What do you need printed?</label>
    <textarea id="message" name="message" rows="4" required>{{ form.get('message','') }}</textarea>
    <p style="margin-top:18px"><button class="btn" type="submit">Send request</button></p>
  </form>
</section>
{% endblock %}
